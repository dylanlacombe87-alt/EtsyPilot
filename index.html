<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EtsyPilot</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0d0d0f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .logo span {
      color: #ff5a5f;
    }

    .logo p {
      color: #aaa;
      margin-top: 0;
    }

    .card {
      background: #19191d;
      border: 1px solid #2b2b31;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #36363d;
      border-radius: 12px;
      background: #111114;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      margin-top: 20px;
      font-size: 17px;
